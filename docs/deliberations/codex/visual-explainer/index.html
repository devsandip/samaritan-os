ot;,&quot;disposition&quot;:&quot;Missing&quot;,&quot;plan_part&quot;:&quot;Jobs are named; interviews are not specified&quot;,&quot;answer&quot;:&quot;The brief names upcoming interviews; v2 covers job matches and recruiter drafts without a dedicated interview workflow.&quot;,&quot;remaining&quot;:&quot;Define interview detection, calendar linkage, company/role context and the reminder or preparation artifact.&quot;,&quot;evidence&quot;:[{&quot;doc&quot;:&quot;brief&quot;,&quot;line&quot;:22,&quot;find&quot;:&quot;upcoming interviews&quot;},{&quot;doc&quot;:&quot;cm&quot;,&quot;line&quot;:146,&quot;find&quot;:&quot;upcoming interviews&quot;},{&quot;doc&quot;:&quot;plan&quot;,&quot;line&quot;:135,&quot;find&quot;:&quot;Jobs |&quot;}],&quot;trail&quot;:null},{&quot;id&quot;:&quot;scheduleowner&quot;,&quot;concern&quot;:&quot;One owner for each logical schedule across services&quot;,&quot;disposition&quot;:&quot;Partial&quot;,&quot;plan_part&quot;:&quot;C1/G1 + unique run admission keys&quot;,&quot;answer&quot;:&quot;One user-facing planner and per-request admission keys reduce duplicate work.&quot;,&quot;remaining&quot;:&quot;A shared scheduler registry or explicit ownership contract is not defined. Two services could still admit the same logical job under different identities.&quot;,&quot;evidence&quot;:[{&quot;doc&quot;:&quot;xb&quot;,&quot;line&quot;:9,&quot;find&quot;:&quot;Exactly one component&quot;},{&quot;doc&quot;:&quot;cm&quot;,&quot;line&quot;:147,&quot;find&quot;:&quot;one owner per schedule&quot;},{&quot;doc&quot;:&quot;plan&quot;,&quot;line&quot;:99,&quot;find&quot;:&quot;unique admission key&quot;}],&quot;trail&quot;:null},{&quot;id&quot;:&quot;staleoutput&quot;,&quot;concern&quot;:&quot;Rescheduled meetings must invalidate stale scheduled output&quot;,&quot;disposition&quot;:&quot;Partial&quot;,&quot;plan_part&quot;:&quot;Phase-1 reschedule acceptance + approval revisions&quot;,&quot;answer&quot;:&quot;The final plan tests a rescheduled meeting and binds approval to a revision.&quot;,&quot;remaining&quot;:&quot;It does not fully define source-version freshness, superseding an old brief or notification, and what happens to work already queued when a meeting changes.&quot;,&quot;evidence&quot;:[{&quot;doc&quot;:&quot;xb&quot;,&quot;line&quot;:45,&quot;find&quot;:&quot;missed morning brief&quot;},{&quot;doc&quot;:&quot;cm&quot;,&quot;line&quot;:148,&quot;find&quot;:&quot;stale scheduled output&quot;},{&quot;doc&quot;:&quot;plan&quot;,&quot;line&quot;:118,&quot;find&quot;:&quot;Five real meetings&quot;}],&quot;trail&quot;:null}],&quot;sources&quot;:{&quot;c1&quot;:{&quot;path&quot;:&quot;claude/round-1.md&quot;,&quot;text&quot;:&quot;# Claude, round 1\n\nWritten 2026-10-20, about 11:05 IST. Independent: I read only PROTOCOL.md,\nCOORDINATION.md and the other agents&#x27; STATUS, USER-ANSWERS and messages files,\nnot their round files. Repo facts: `notes/existing-systems.md`. Evidence with\nlinks: `notes/research-evidence.md`. Integration detail: `notes/integrations.md`.\n\n## 1. Recommendation in one paragraph\n\nDo not adopt OpenClaw or Hermes as the core, and do not start over. Sandip\nalready built the hard, unusual part: Samaritan&#x27;s Action Center (typed items,\nper-item policy, audit trail, degrade-to-guided, money lock). What is missing is\nplumbing, not a platform: an always-on daemon with a scheduler and event inputs,\nan activity ledger that every agent reports into (Samaritan capabilities, Claude\nCode sessions, scheduled tasks, Codex, Gemini, Thornhill), a \&quot;give it a task\&quot;\nverb, and one small MCP server so every assistant can reach the same memory and\ninbox. Run the LLM work on the Claude Agent SDK inside Samaritan&#x27;s Run Layer.\nMake Samaritan the single brain: Thornhill keeps its phone executor and drops\nits planned separate brain, task store and Telegram bot. Build the first\nworkflow Sandip chose (meeting context, notes, follow-up tasks) on the current\nMac within two weeks, then widen.\n\n```\n Askers: Sandip (laptop UI, phone PWA, Telegram) | Claude Code / Cowork / claude.ai\n         | Codex | Gemini CLI | scheduled triggers | webhooks and pollers\n                   |  MCP \&quot;samaritan\&quot; (\u003c= 10 tools)  |  HTTP API  |  Telegram bot\n                   v\n +----------------------------------------------------------------------------+\n | Samaritan daemon on the Mac (one Node process, launchd)                     |\n |  scheduler | event bus | run layer (Agent SDK runs) | policy | Action Center |\n |  task store | activity ledger | recall index | delivery (Telegram, push)     |\n +----------------------------------------------------------------------------+\n        | execution registry: guided / assisted / automated\n        v\n  Notion  TickTick  Obsidian  Gmail (MailMCP)  Calendar  Hevy  Thornhill phone  ...\n```\n\n## 2. Decision table\n\n| ID | Position | Conf. | Reason |\n|---|---|---|---|\n| D1 Runtime | Claude Agent SDK (TypeScript) called from Samaritan&#x27;s Run Layer for LLM capabilities and ad hoc tasks. Claude Code stays the interactive coding tool. No OpenClaw, no Hermes core. Hermes stays a candidate worker later (its `/v1/runs` API with `pending_controls` could feed the Inbox). | high | Same language as Samaritan; no second memory or second inbox; Agent SDK is covered by plan limits or Max monthly credits. OpenClaw: 722 advisories, 14 critical, by 2026-10-18, huge surface. Both treat Claude as a third-party harness for billing. |\n| D2 Command centre | Extend Samaritan&#x27;s UI. Keep Inbox. Add three views: Now (today, what needs me, what is running), Activity (every run from every runtime: running, waiting on me, done, failed, with Stop and Mute), Tasks (a composer like Cowork: describe a job, it runs, questions and approvals come back as Inbox items). Settings gains per-source notification rules. | high | The Inbox, render schemas and audit already exist. Hermes&#x27;s dashboard and OpenClaw&#x27;s Control UI and Workboard are admin panels for their own agent, not a life inbox across runtimes. |\n| D3 Second brain | One canonical home per kind of data. Obsidian vault: prose and every generated artifact. Notion: the four typed DBs. TickTick: tasks. Samaritan SQLite: system state (items, tasks, runs, audit) plus a derived recall index over the vault and Notion. Nothing new. | high | Already in place through `AGENT_OS.md`. Adding a framework brings its own memory (Hermes `MEMORY.md`/`USER.md`, OpenClaw stores) that would compete. |\n| D4 Cross-assistant | (a) One MCP server `samaritan`, at most about ten tools with plain schemas: recall, today, list inbox, propose item, submit task, get task, answer task, log activity, capture. Local for Claude Code, Codex, Gemini CLI, Claude desktop. Remote (Streamable HTTP behind OAuth, via Tailscale Funnel or Cloudflare Tunnel) for claude.ai and ChatGPT. (b) One instructions file in the vault that each global file points to: `~/.claude/CLAUDE.md`, `~/.codex/AGENTS.md`, `~/.gemini/GEMINI.md`. | med | ChatGPT only reaches public HTTPS MCP servers. Gemini&#x27;s consumer app takes custom MCP only through Spark (US, AI Pro/Ultra), so in India Gemini means Gemini CLI. Thornhill showed Cowork drops arguments on a 33-tool server, so keep the toolset small. |\n| D5 Surfaces | Laptop: full UI on 127.0.0.1. Phone: same UI as a home-screen PWA over Tailscale. Telegram: push, approve/reject/snooze buttons, capture, submit a task, answer questions. One bot only. Coding sessions stay on Anthropic&#x27;s Remote Control; Samaritan links to them. | high | iOS web push is unreliable, so Telegram does push and the PWA does reading and acting. Claude Code&#x27;s Telegram channel only works while a session is open, so it cannot be the system bot. |\n| D6 Hosting | Current Mac, per Sandip&#x27;s answer, under launchd with sleep disabled, reached over Tailscale. Keep Nutgraf and MailMCP on AWS. Revisit a Mac mini only if the current Mac travels. | high | iMessage, the vault, Keychain and the USB phone all need a Mac. A VPS cannot reach them. |\n| D7 Integrations | Official API or MCP first, Mac-local second, phone third, unofficial bridge last. Full table in `notes/integrations.md`. | med | Several brief items have hard limits: Oura stress is a daily summary, not real time; Hevy API needs Pro; WhatsApp has no personal API and bridges risk a ban. |\n| D8 Phone | Thornhill becomes Samaritan&#x27;s phone executor (`phone.task` action type, guided or assisted only), keeping its device pool, locks and learning layer. Use it only for the API gaps its own report lists. | med | Two brains with two task stores and two Telegram bots is the main risk in the current plans. Thornhill&#x27;s task model is good; adopt it as Samaritan&#x27;s task model. |\n| D9 Trust | Keep the policy engine, money lock and audit. Add Meta&#x27;s Rule of Two: a run that reads untrusted text (WhatsApp, iMessage, email, web) gets no send or write tools; its output is an Inbox item. Add a real Stop (abort the run, today a timeout only stops waiting), fail-closed approval timeouts, and an \&quot;auto-approve after N minutes unless I object\&quot; tier for low-risk items. Public exposure only for the remote MCP, behind OAuth, with task-level tools only. No marketplace skills. | high | Reading messages and email is the brief&#x27;s biggest injection surface. |\n| D10 Sequence | Phase 0, 2 to 3 sessions: daemon under launchd, node-cron scheduler, Telegram on with a scheduled flush, real Stop. Phase 1, about 4 sessions: Sandip&#x27;s first workflow (calendar poller, meeting prep 15 min before, post-meeting nudge, `meeting` extraction to Inbox, approved items to TickTick and Notion) plus Claude Code hooks to the activity ledger and a morning brief. Phase 2, about 5 sessions: Activity and Tasks views on the Agent SDK, local `samaritan` MCP, PWA, pointer files. Phase 3: email triage, job search, iMessage digest, bills from email, Oura and Hevy, Nutgraf. Phase 4: Thornhill adapter, WhatsApp via the agent phone, remote MCP with OAuth, music. | med | Sessions mean focused Claude Code sessions; Samaritan v0 took one sitting. Each phase leaves something he uses daily. |\n| C1 One brain | Samaritan is the only planner, task store, approval inbox and Telegram bot. Thornhill, Nutgraf and MailMCP are services it calls. | med | See D8. Proposed as a new ID. |\n| C2 Billing | Unattended Agent SDK runs use a Console API key funded by the Max monthly credits, with a spend cap; interactive work stays on the plan. | low | Credits are explicitly sanctioned for the SDK; the plan-limit path for the SDK was \&quot;paused\&quot;, which can change. Depends on his plan. |\n\n## 3. What changed since my last round\n\nFirst round.\n\n## 4. Pushback on the others\n\nNothing read yet. One pre-emptive note on a fact I expect will come up: Codex\nis right that Hermes has a real dashboard and a run API with approvals, and that\nOpenClaw has Workboard. I checked both. Neither changes my D1: Hermes&#x27;s\ndashboard is an admin panel bound to loopback with no login by default, and its\napprovals are per command, off by default; Workboard describes itself as\n\&quot;intentionally small\&quot; and scoped to one OpenClaw gateway.\n\n## 5. Open questions for the other agents\n\n1. If you recommend Hermes or OpenClaw as the core, what happens to the\n   Action Center&#x27;s typed items and per-item policy, to the Obsidian vault as\n   memory, and to Claude billing as a third-party harness?\n2. Do you agree Thornhill should not have its own brain? If not, how do two\n   task stores and two Telegram bots stay consistent?\n3. Is there a lighter path to D5 than a PWA (for example Telegram Mini Apps)?\n   I have not researched it.\n4. Can anyone confirm Codex CLI and Gemini CLI hook events good enough to\n   detect \&quot;waiting for input\&quot;?\n\n## 6. Open questions for Sandip\n\nAlso in `QUESTIONS.md`.\n\n1. Which Claude plan are you on (Pro, Max 5x, Max 20x)? It decides C2.\n2. Does the current Mac stay at home, or is it the laptop you carry?\n3. Thornhill: fine to make it Samaritan&#x27;s phone executor, or do you want it to\n   stay a separate product with its own brain?\n4. Fireflies or Granola for meeting notes? Do you have Hevy Pro and Spotify\n   Premium?\n5. WhatsApp: is a read-only digest from the agent phone enough, and do you\n   agree never to run an unofficial bridge on your main number?\n6. Email: drafts only (my recommendation), or should anything ever send?\n\n## 7. Sources\n\nSee `notes/research-evidence.md` for every claim with its link. Main ones:\n\n- https://clawdocs.org/security/known-vulnerabilities\n- https://docs.openclaw.ai/plugins/workboard\n- https://hermes-agent.nousresearch.com/docs/user-guide/features/web-dashboard\n- https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server\n- https://support.claude.com/en/articles/15036540-use-the-claude-agent-sdk-with-your-claude-plan\n- https://code.claude.com/docs/en/hooks\n- https://code.claude.com/docs/en/channels\n- https://code.claude.com/docs/en/remote-control\n- https://coworker.ai/blog/chatgpt-mcp\n- https://www.usecarly.com/blog/gemini-mcp/\n- https://simonw.substack.com/p/new-prompt-injection-papers-agents\n- Local: `samaritan/journal/INDEX.md`, `samaritan/docs/COMPETITIVE-LANDSCAPE.md`,\n  `esp32-iphone-agent/docs/architecture.md`, `esp32-iphone-agent/WORKLOG.md`,\n  `the-library/docs/architecture.md`\n&quot;,&quot;sha256&quot;:&quot;8e161d3d134d165815ba2e4eb85b8d1a6b8dac5cb37dac7569ed5bdd271a1f53&quot;},&quot;c2&quot;:{&quot;path&quot;:&quot;claude/round-2.md&quot;,&quot;text&quot;:&quot;# Claude, round 2\n\nWritten 2026-10-20, about 11:25 IST, after reading `codex/round-1.md`,\n`codex/build-blueprint.md`, `codex/integration-matrix.md`,\n`codex/repo-audit.md`, `gemini/round-1.md`, and both QUESTIONS files.\n\n## 1. Recommendation in one paragraph\n\nWe agree on the shape. Samaritan is the one brain and control plane: one task\nstore, one approval inbox, one Telegram bot, one audit trail. Thornhill shrinks\nto a phone executor; Nutgraf, MailMCP and the source apps stay authoritative for\ntheir own data. A Claude Agent SDK worker runs behind a small worker interface\ninside Samaritan; neither OpenClaw nor Hermes becomes the outer daemon. The\nfirst build is a minimal always-on daemon, then the meeting workflow Sandip\nchose, then tasks and runs, then the other domains. What is left to settle is\nsmall: whether to trial another runtime and when, whether assistants may\napprove items through MCP (I say no), what the shared context file contains,\nand the phase order around durability. My positions on each are below.\n\n## 2. Decision table\n\n\&quot;Agree\&quot; lists who already holds this position in round 1.\n\n| ID | Position | Conf. | Agree | Reason |\n|---|---|---|---|---|\n| D1 Runtime | Agent SDK worker behind Codex&#x27;s five-method interface (`start`, `events`, `answer`, `cancel`, `status`), run in a child process. Deterministic capabilities stay as they are. No outer OpenClaw or Hermes daemon. Any runtime trial waits until after Phase 1 and starts with Hermes, not OpenClaw. | high | Codex, Gemini (on SDK and no outer daemon); trial timing open | See 4.1. |\n| D2 Command centre | Extend Samaritan&#x27;s UI. Keep Codex&#x27;s three concepts apart: delegated task, run, action item. Views: Now, Inbox, Activity, Tasks, plus Gemini&#x27;s Ask/Delegate command bar. Muting a source silences delivery, never the job. | high | all three | Changed: adopted Codex&#x27;s separation and Gemini&#x27;s command bar. |\n| D3 Second brain | Vault for prose, Notion for the four typed DBs, TickTick for to-dos, SQLite for system state, recall index derived. Adopt Codex&#x27;s artifact store at `~/.samaritan/artifacts/\u003ctask-id&gt;/` for raw run output, with one rule: anything Sandip would read (brief, minutes, WBR, PRD draft) is exported into one vault folder. | high | all three | Changed: added the artifact store. |\n| D4 Cross-assistant | One local MCP server, about seven tools: `get_context`, `search`, `read_artifact`, `submit_task`, `task_status` (with answer), `propose_action`, `list_inbox` (read-only). No approve tool. One static routing document that the global files for Claude Code, Codex and Gemini CLI point to. Remote MCP for claude.ai and ChatGPT web is Phase 4. | high | Codex; Gemini differs on approve tool and on the index file | See 4.2 and 4.3. Corrected: Codex desktop and CLI do reach local MCP; ChatGPT web needs a remote plugin. |\n| D5 Surfaces | One backend. Laptop UI; responsive phone web over Tailscale, installable later; Telegram two-way with inline Approve, Edit, Snooze, Mute. The actor comes from an authenticated session, not from the request body. | high | all three; auth point from Codex | Today the API trusts loopback and takes `actor` from the request (Codex audit). That must change before anything leaves 127.0.0.1. |\n| D6 Hosting | Current Mac under launchd, sleep disabled, Tailscale. Test that the daemon can reach Keychain after a reboot before login (Codex&#x27;s FileVault point). | high | all three | |\n| D7 Integrations | API first, Mac second, phone third, unofficial last. Phase 1 adds a TickTick API adapter so approved meeting tasks are created, not just staged. Specific corrections to Gemini in 4.4. | high | all three on the rule | |\n| D8 Phone | Thornhill keeps device pool, locks, routines, WDA now and ESP32 later. Its brain, task store, bot and front door fold into Samaritan. | high | all three | |\n| D9 Trust | Policy engine, money lock and audit stay. Add: Rule of Two for any run reading untrusted text; approvals bound to an exact payload hash and account; authenticated approver; scoped credentials per worker; fencing so a cancelled or timed-out run cannot emit or write. | high | all three | Adopted Codex&#x27;s payload binding and fencing. |\n| D10 Sequence | See 4.5. Phase 0 minimal daemon, Phase 1 meetings plus coding-wait alerts, Phase 2 tasks and runs, Phase 3 domains, Phase 4 phone, WhatsApp, remote MCP. First dependable command centre in 2 to 4 focused weeks. | med | close to both | |\n| C1 = G1 One brain | Merged with Gemini&#x27;s G1. | high | all three | |\n| G2 Fixes first | Accept, and add Gemini&#x27;s `dailyNotePath()` UTC bug. Cancellation by child process rather than AbortSignal alone, per Codex. | high | all three | |\n| C2 Billing | Unattended runs use a Console API key funded by Max monthly API credits, with Codex&#x27;s per-run and daily budgets. Interactive work stays on the plan. | med | open | See 4.6. |\n\n## 3. What changed since my last round\n\n- D2, D3, D9: adopted Codex&#x27;s task/run/action-item split, artifact store,\n  payload-bound approvals, fencing and authenticated actor. Each fixes a hole I\n  had not covered.\n- D2: adopted Gemini&#x27;s Ask/Delegate command bar.\n- D4: corrected. I said ChatGPT needs a remote server. That holds for ChatGPT\n  web, but Codex&#x27;s desktop app and CLI read local MCP servers from\n  `~/.codex/config.toml` (https://learn.chatgpt.com/docs/extend/mcp). So the\n  local server covers Claude Code, Claude desktop, Codex and Gemini CLI.\n- D1: a runtime trial is now acceptable to me, later and with a different first\n  candidate (4.1).\n- D10: Claude Code waiting alerts move into Phase 1 because they need no new\n  tables (4.5).\n\n## 4. Pushback and answers\n\n### 4.1 Codex: the up-front runtime trial\n\nCodex proposes up to two days comparing the SDK worker with OpenClaw before\ncommitting, judged partly on restart recovery. Two problems.\n\nFirst, the restart test will not separate the candidates. Hermes documents that\n\&quot;runs do not survive a gateway restart\&quot;; an active run is recorded as\n`run.interrupted` and is not requeued\n(https://hermes-agent.nousresearch.com/docs/developer-guide/programmatic-integration).\nThe Agent SDK does not persist runs for you either. Durable admission, leases\nand reconciliation belong to Samaritan whichever runtime runs inside it, which\nis exactly what Codex&#x27;s own blueprint says.\n\nSecond, if we trial anything, Hermes fits the worker interface better than\nOpenClaw. Its `/v1/runs` gives create, SSE events, status, approval and stop,\nnearly one to one with `start/events/status/cancel`, and its approval pause\n(`pending_controls`) can become a Samaritan question. Codex&#x27;s own finding is\nthat OpenClaw&#x27;s generic tools endpoint is trusted operator access, and OpenClaw\nhad 722 published advisories, 14 critical, by 2026-10-18.\n\nProposal: no trial before Phase 1. After Phase 2 exists, if a concrete need\nappears (Hermes&#x27;s self-written skills, or OpenClaw&#x27;s channel breadth), run\nCodex&#x27;s two-day trial with Codex&#x27;s exact criteria, Hermes first. Keep the\nreversal criterion: a runtime that removes more code than its bridge adds\nreplaces the SDK worker.\n\n### 4.2 Gemini: `samaritan_act` lets any assistant approve items\n\nGemini&#x27;s six tools include `samaritan_act(action_item_id, response_id, edits)`.\nThat lets ChatGPT, Gemini or a Claude session approve its own proposal, which\nremoves the human from the loop the Action Center exists for, and a prompt\ninjected into any of those sessions could approve a send. Codex makes the same\npoint: assistants propose, an authenticated human approves. I would drop the\ntool. Approvals happen in the UI, the phone web view or Telegram.\n\n### 4.3 Gemini: auto-generated `BRAIN_INDEX.md` with live personal data\n\nA file rewritten every 15 minutes with today&#x27;s calendar, decisions and the last\n20 actions, pointed to from `~/.claude/CLAUDE.md` and `~/Developer/CLAUDE.md`,\nputs personal and employer context into every coding session in every repo,\nand goes stale between rewrites. Keep the shared file static and short: what\nSamaritan is, where things live, which MCP tools to call. Live state comes from\n`get_context` when a session asks. Codex&#x27;s blueprint says the same: \&quot;about\nrouting and capabilities, not the contents of your entire life.\&quot;\n\n### 4.4 Gemini: day-in-the-life details\n\n- `stress-watch` polling Oura every 30 minutes: Oura&#x27;s `daily_stress` is a daily\n  summary and data arrives only after the phone syncs, sometimes hours late. A\n  30-minute poll adds cost and no signal. Keep the pre-meeting music\n  suggestion; drop the stress trigger until an intraday signal is verified.\n  This also answers Gemini&#x27;s question 4: (a) yes, (b) no.\n- `morning-coach` updating the Hevy routine on approval: agree with Codex,\n  write a copy of the routine for today, never overwrite the plan.\n- `commute-podcast` generating TTS inside Samaritan: Nutgraf owns newsletter\n  ranking and its planned audio. Samaritan links to what Nutgraf produces.\n- `dev-watch` reading `~/.claude/projects/*.jsonl` and process state: use the\n  documented Notification hook matchers (`permission_prompt`, `idle_prompt`,\n  `agent_needs_input`) and Stop/SessionEnd as HTTP hooks. Transcript files are\n  an internal format.\n- `calendar-from-screenshot` \&quot;auto-stages if confidence &gt;= 0.75\&quot;: fine if\n  \&quot;stage\&quot; means it lands in the Inbox as a proposal. Confidence must not commit\n  a calendar write on its own.\n\n### 4.5 Codex: phase order\n\nCodex puts the meeting workflow (stage 1) before the supervised host and\ndurable runs (stage 2). But the meeting workflow&#x27;s pre-meeting brief and\npost-meeting nudge are scheduled, so they need a running daemon and a scheduler\nfirst. Proposed merge:\n\n- Phase 0, 2 to 3 days: launchd daemon, node-cron scheduler with\n  `schedule_receipts` so an occurrence fires once, the Telegram `flush()`\n  caller, child-process cancellation, authenticated actor, `dailyNotePath()` fix.\n- Phase 1, 3 to 5 days: Codex&#x27;s seven-step meeting workflow and its acceptance\n  test (five real meetings, including a reschedule and missing notes), a\n  TickTick API adapter, and Claude Code waiting alerts. The alerts reuse the\n  existing ingest path: an HTTP hook posts to a small endpoint that emits a\n  standard action item (`card` layout, responses Open and Dismiss). No new\n  tables. The hooks config change in `~/.claude/settings.json` is a proposal\n  for Sandip to apply.\n- Phase 2, 5 to 8 days: Codex&#x27;s records (tasks, runs, run_events, questions,\n  artifacts, approvals, outbox, leases), Activity and Tasks views, the Agent\n  SDK worker, the local MCP server, Telegram inbound, phone web.\n- Phase 3: morning plan, email and recruiter drafts, PostHog pulse, Nutgraf\n  brief (needs its machine credential first), bills from email, Oura and Hevy\n  proposals, iMessage digest.\n- Phase 4: Thornhill adapter, WhatsApp digest from the agent phone, remote MCP\n  with OAuth, music.\n\n### 4.6 Billing: please verify\n\nCodex wrote that API usage should not rest on \&quot;unverified assumption about\nconsumer subscription entitlements\&quot;. Agreed, so here is what I found. Anthropic&#x27;s\nsupport article says today: \&quot;You can still use the Claude Agent SDK, claude -p,\nand third-party apps with your subscription limits\&quot;, with a June 15 note that a\nplanned change was paused, and an October 7 note that \&quot;Claude Max and Team\nplans now include monthly API credits\&quot;\n(https://support.claude.com/en/articles/15036540-use-the-claude-agent-sdk-with-your-claude-plan).\nSecondary sources give $100 for Max 5x and $200 for Max 20x, covering the API\nand Agent SDK, no rollover (https://qcode.cc/en/claude-max-team-api-credits).\nAn April 2026 report said third-party harnesses such as OpenClaw lost plan\ncoverage (https://thenextweb.com/news/anthropic-openclaw-claude-subscription-ban-cost).\nThe stable route for unattended runs is an API key under those credits, with\nbudgets. Please check this independently; it depends on Sandip&#x27;s plan, which I\nhave asked.\n\n## 5. Answers to the other agents&#x27; questions\n\nCodex:\n1. For the meeting slice, no runtime removes more code than it adds. The slice\n   is a calendar poller, two scheduled triggers, one extraction call and the\n   existing review path. The SDK earns its place in Phase 2 for free-form\n   tasks. Hermes&#x27;s run interface is cited in 4.1.\n2. Yes, Samaritan owns action policy.\n3. Yes, Thornhill shares task identity and approval state.\n4. None found. `daily_stress` is daily; webhooks fire after the app syncs.\n5. Live in milestone 1: calendar read, note intake (paste, Telegram or\n   Fireflies), extraction, review, TickTick create, Notion and vault writes\n   (already live adapters). Guided is acceptable only for minutes by email.\n\nGemini:\n1. Yes, scrap the separate Thornhill brain.\n2. No case for an outer OpenClaw or Hermes daemon.\n3. Yes to a tasks table, using Codex&#x27;s split into tasks, runs, questions and\n   action items rather than one table carrying every state.\n4. See 4.4.\n\n## 6. Open questions for the other agents\n\n1. Do you accept dropping the approve tool from MCP (4.2) and keeping the\n   shared file static (4.3)?\n2. Codex, do you accept the trial after Phase 2 with Hermes first (4.1)?\n3. Is Phase 0 before the meeting slice acceptable (4.5)?\n4. Can either of you confirm or refute the billing facts in 4.6?\n\nIf the answers are yes or close, I think round 3 can be the consensus draft.\nBy the protocol&#x27;s tie-break (alphabetical: claude, codex, gemini), I would\ndraft `consensus/PROPOSAL.md` and you would sign off or amend in your round 3.\n\n## 7. Open questions for Sandip\n\nMerged with Codex&#x27;s and Gemini&#x27;s to avoid asking twice. Also in `QUESTIONS.md`.\n\n1. Which Claude plan are you on? (decides C2)\n2. Does the current Mac stay at home, or do you carry it? (D6)\n3. Meeting source: Fireflies, Granola, or notes you type? Which calendar? (Codex, Gemini)\n4. Keep TickTick as the task app? (Codex, Gemini)\n5. Monthly model budget and a daily cap on proactive interruptions? (Codex)\n6. Do you have Hevy Pro? Spotify or Apple Music? (Gemini, me)\n7. Messaging: read iMessage on the Mac, WhatsApp only from the agent phone, never an unofficial bridge on your main number? (Gemini, me)\n8. Email: drafts only, or may anything send? (me)\n\n## 8. Sources\n\nNew this round:\n- https://hermes-agent.nousresearch.com/docs/developer-guide/programmatic-integration\n- https://learn.chatgpt.com/docs/extend/mcp\nRound 1 sources: `notes/research-evidence.md`. Peer files cited inline.\n&quot;,&quot;sha256&quot;:&quot;b6d057d639d153c0b91ca1a33d5cccdb95e4eb28c4ee2f5151313808647f1a46&quot;},&quot;c3&quot;:{&quot;path&quot;:&quot;claude/round-3.md&quot;,&quot;text&quot;:&quot;# Claude, round 3\n\nWritten 2026-10-20 11:05 IST after reading `codex/round-2.md` and `gemini/round-2.md`.\n\n## 1. Recommendation in one paragraph\n\nWe have converged. I drafted `consensus/PROPOSAL.md` v1 per the tie-break and\nsign off on it. It is the round 2 agreement plus the corrections below.\n\n## 2. Decision table\n\nAll rows as written in `consensus/PROPOSAL.md` v1. I agree with every row.\n\n## 3. What changed since my last round, and why\n\nAccepted from Codex:\n- Hermes approvals: `smart` is the default and unattended runs default to\n  `deny` (checked: https://hermes-agent.nousresearch.com/docs/user-guide/security/).\n  My \&quot;off by default\&quot; came from a third-party guide and was wrong.\n- The OpenClaw advisory count is a third-party aggregation of mostly fixed\n  issues. It no longer appears as a deciding reason.\n- Gemini Spark is rolling out to AI Pro subscribers in India from 2026-07-29\n  (checked: Google India blog). My \&quot;US only\&quot; was wrong. The Gemini app moves to\n  \&quot;test in Phase 4\&quot;, not \&quot;unavailable\&quot;.\n- No countdown auto-approve tier. Silence never approves. Gemini agreed.\n- One brain is an ownership rule, not one database.\n- Minimal retrieval belongs in the meeting milestone.\n- Effort ranges, not dates.\n\n  + FTS5 + `sqlite-vec`) as the operational ledger and unified RAG index | High | Matches your working `pm-os.item.file` adapter and `src/recall/` design without duplicating prose into databases or structured rows into markdown. |\n| **D4** | **Single 6-tool `samaritan-mcp` server** (stdio + localhost HTTP) plus an auto-generated `~/.samaritan/BRAIN_INDEX.md` referenced from global `CLAUDE.md`, `GEMINI.md`, and `AGENTS.md` | High | Thornhill proved on 2026-10-18 that Cowork drops tool arguments on 33-tool MCP servers while 4-tool servers work; a tiny MCP surface plus deterministic file paths works across Claude, ChatGPT, and Gemini. |\n| **D5** | **Laptop Web SPA (`127.0.0.1:4173`)** for deep work/batch triage, **Mobile PWA over Tailscale (`sandip-mac.tail9b2f5e.ts.net:4173`)** for phone dashboard/audio, and **one unified Telegram bot** for push alerts, inline Approve/Reject buttons, and quick task capture | High | One shared Fastify API and SQLite store prevents split state across laptop, phone, and Telegram. |\n| **D6** | **Current Mac initially (`launchd` daemon + `caffeinate -dis`)**, keeping only stateless ingress (`MailMCP`, `the-library`) on AWS Lambda | High | Confirmed by Sandip in `codex/USER-ANSWERS.md`; local execution is required for repo journals, Obsidian vault, macOS Keychain, Claude Code session logs, and USB WebDriverAgent. |\n| **D7** | **API/MCP-first (`MailMCP`, Google Calendar, Fireflies, Oura V2, Hevy API, PostHog, TickTick OAuth, `the-library`), reusing code from `healthAI`, `job_tracker`, and `scrask-bot`; phone UI automation only for gaps** | High | Half of the required connectors already exist across your `~/Developer/` repos as standalone silos that just need thin Samaritan capability wrappers. |\n| **D8** | **Retire Thornhill&#x27;s planned Brain/Telegram bot; run Thornhill strictly as the local Phone Executor Gateway daemon (`127.0.0.1`) behind a Samaritan execution adapter (`phone.task.run`)** | High | Building Thornhill&#x27;s separate task store, planner, and approval bot would duplicate Samaritan&#x27;s Action Center; phone stop-points (`stop_before` pay/send) should emit directly to Samaritan&#x27;s Inbox. |\n| **D9** | **Keep Samaritan&#x27;s 3 structural invariants (DB audit triggers, 3-place money lock, guided fallback) + enforce a zero-tool structured-output quarantine on untrusted text (email, WhatsApp, job pages)** | High | Reading WhatsApp, iMessage, and email exposes the system to indirect prompt injection; separating untrusted extraction from gated execution prevents silent exfiltration or unauthorized sends. |\n| **D10** | **Phase 1 (Days 1-4): Daemon + Scheduler + Meetings workflow (pre-meeting brief -&gt; post-meeting note -&gt; tasks); Phase 2 (Days 5-8): Command Centre UI + `samaritan-mcp` + bi-directional Telegram; Phase 3 (Days 9-14): Oura/Hevy, Nutgraf, Email/Scrask, WBR, Jobs; Phase 4 (Days 15-20): Thornhill adapter + Recall v1** | High | Directly delivers Sandip&#x27;s #1 chosen workflow (`Meeting context -&gt; notes -&gt; follow-up tasks`) on his current Mac in week 1 before expanding breadth. |\n| **G1** | **Unify Brain &amp; Task Store:** Merge Thornhill&#x27;s `task_submit`/`task_get` state machine (`queued|planning|running|needs_input|needs_approval|done`) into Samaritan&#x27;s SQLite store | High | Gives Samaritan the \&quot;Claude Cowork\&quot; async task dispatch model for both desktop and phone tasks without running two competing orchestrators. |\n| **G2** | **Fix Run Layer &amp; Delivery gaps before daemonizing:** Add `AbortSignal` / worker termination to `src/run-layer/index.ts` and wire a scheduled caller for `TelegramDelivery.flush()` in `src/delivery/index.ts` | High | Code inspection shows `withTimeout()` currently leaks timed-out runs in the background and `TelegramDelivery.flush()` is never called after quiet hours end. |\n\n---\n\n## 3. What changed since my last round\n\nN/A (Round 1 baseline).\n\n---\n\n## 4. Pushback on the others\n\nN/A for Round 1 (independent research). Specific pushback and synthesis will follow in Round 2 after reading `claude/round-1.md` and `codex/round-1.md`.\n\n---\n\n## 5. Open questions for the other agents\n\n1. **To Claude and Codex (Brain consolidation, `G1`):** `esp32-iphone-agent/docs/architecture.md` specifies a standalone Thornhill Brain service with its own SQLite task store, its own Telegram bot, and its own approval loop. Do we all agree to scrap the separate Thornhill Brain and use Samaritan as the single brain, approval gate, and Telegram bot, keeping Thornhill purely as the phone device-pool executor?\n2. **To Claude and Codex (OpenClaw / Hermes role, `D1`):** OpenClaw recently added `Workboard` and Control UI session dashboards, and Hermes Agent has `hermes-webui` plus skill self-learning. However, adopting either as the top-level daemon means giving up Samaritan&#x27;s schema-driven `ActionItem` contract and SQLite trigger invariants, or maintaining two control planes. Do either of you see any justification for running OpenClaw or Hermes as the outer daemon, versus invoking them (or borrowing OpenClaw&#x27;s channel/skill logic like `scrask-bot`) *inside* Samaritan&#x27;s Run Layer?\n3. **To Claude and Codex (Cowork task model in Samaritan, `D2`):** Samaritan v0 models **Action Items** (outputs waiting on human review), but does not yet model **Tasks** (user-submitted goals like \&quot;research 5 PM roles and draft outreach\&quot; that run multi-step in the background and occasionally emit Action Items when `needs_input` or `needs_approval`). Should we add a first-class `tasks` table to `samaritan.db` (adopting Thornhill&#x27;s `queued -&gt; running -&gt; needs_input/needs_approval -&gt; done` lifecycle) so the Command Centre handles both inbound triage and outbound Cowork delegation?\n4. **To Claude and Codex (Oura daytime stress trigger, `D7`):** The scratch-pad asks for music when stressed in Oura. Oura&#x27;s V2 API (`daily_stress`) exposes periodic daytime stress summaries rather than a real-time continuous stream. Should we scope the music trigger to (a) pre-meeting calendar hooks (5 minutes before high-stakes meetings) plus (b) 30-minute polling of Oura&#x27;s daytime stress summary when at the desk?\n\n---\n\n## 6. Open questions for Sandip\n\n*(Also written to `gemini/QUESTIONS.md`.)*\n\n1. **TickTick vs Notion for task tracking:** Your `CLAUDE.md` says TickTick is your canonical TODO inbox, and Samaritan v0 stages tasks for TickTick. Do you want to keep TickTick as the primary task app (by wiring its OAuth Open API for one-click creation), or move daily tasks into Samaritan/Notion/Obsidian?\n2. **Meeting capture source when Fireflies is not in the call:** For your #1 workflow (meeting context -&gt; notes -&gt; follow-up tasks), are all your work meetings recorded by Fireflies, or do you also need a local Mac audio/system-audio transcriber (like Whisper/Parakeet) for ad-hoc calls and huddles where a bot cannot join?\n3. **Hevy API availability:** Hevy&#x27;s official REST API (`api.hevyapp.com/v1`) requires a Hevy Pro subscription and API key to read/update routines programmatically. Do you have a Hevy API key, or should Samaritan adjust workouts via Thornhill driving the Hevy iOS app on the spare iPhone?\n4. **WhatsApp &amp; iMessage read path:** On your Mac, iMessage can be read directly from `~/Library/Messages/chat.db` (Full Disk Access), while WhatsApp can either be read via the linked companion session on the Thornhill iPhone or a local bridge (like `whatsmeow`/Beeper). Are you comfortable granting local read-only DB access on your Mac, or should personal messaging stay strictly on the dedicated agent iPhone?\n5. **Music provider:** When Samaritan offers focus or high-energy music before key meetings or on high-stress days, do you use Spotify, Apple Music, or YouTube Music?\n\n---\n\n## 7. Deep-Dive Architecture &amp; Codebase Audit\n\n### 7.1 Why Samaritan Beats OpenClaw and Hermes as the Core OS\n\nA review of `samaritan/docs/COMPETITIVE-LANDSCAPE.md` and current October 2026 releases of OpenClaw (`openclaw/openclaw`) and Hermes Agent (`NousResearch/hermes-agent`) shows a clear architectural divide:\n\n| Dimension | OpenClaw (Oct 2026) | Hermes Agent (Oct 2026) | Samaritan (v0 + v1 plan) |\n|---|---|---|---|\n| **Primary unit** | Chat session / `flow_run` | Autonomous agent loop + self-written skills | Typed `ActionItem` + thick `manifest.yaml` |\n| **Approval guarantee** | Tool-exec prompt (`deny/allowlist/ask/auto`); prose `AGENTS.md` standing orders | `write_approval.py` only gates its own memory/skill writes; off by default | Fail-closed `expr-eval` Policy Engine + 3-place hardcoded money lock |\n| **Audit invariant** | Metadata-only log; docs state \&quot;absence of a row proves nothing\&quot; | Session logs in SQLite | SQLite triggers abort any `action_items` transition without an `action_item_events` row |\n| **Unattended cron behavior** | Executes directly or blocks session | Executes directly unless skill write approval is enabled | Evaluates policy -&gt; auto-completes low-risk items or queues in Action Center + Telegram |\n| **UI rendering** | Control UI + Workboard (session/task centric) | `hermes-webui` (chat + terminal + skill diff) | Schema-driven `card`, `form`, `document`, `diff` surfaces (`ui/src/renderers/`) |\n| **Degradation** | Fails if tool/skill is missing | Fails or hallucinates workaround | Degrades automatically from `automated` -&gt; `assisted` -&gt; `guided` |\n\n**Verdict:** OpenClaw and Hermes are built to maximize autonomous tool execution; Samaritan is built to maximize **trusted delegation**. Because this system touches work email, calendar, WhatsApp, bills, and job applications, Samaritan&#x27;s governance contract must sit at the top. Where Hermes or Claude Agent SDK shine (multi-step research, coding, or drafting), they should run *inside* a Samaritan capability or task worker and emit their proposed side effects to Samaritan&#x27;s Action Center.\n\n### 7.2 Inventory of What You Already Have Across `~/Developer/`\n\nYou do not have a blank slate. You have six working or half-built pieces that have never been wired together:\n\n1. **`~/Developer/samaritan` (The Kernel &amp; Inbox):**\n   - **Working:** `node:sqlite` store, migrations 1-5, Policy Engine, Execution Registry (`notion.*`, `obsidian.*`, `ticktick.*`, `pm-os.item.file`), Run Layer (`src/run-layer/index.ts`), React SPA (`Dashboard`, `Inbox`, `Deferred`, `Completed`, `Settings`), Telegram outbound with quiet hours (`src/delivery/index.ts`), capability scaffolder, Claude scheduled-task importer, 330 passing tests.\n   - **Gaps to fix immediately:**\n     - No long-running daemon (`node-cron` + event bus + `launchd` plist).\n     - `TelegramDelivery.flush()` (`src/delivery/index.ts:158`) is never called by a timer, so quiet-hour messages stay queued.\n     - `withTimeout()` (`src/run-layer/index.ts:145`) uses `Promise.race` without an `AbortController` or worker termination, leaving timed-out capabilities running in the background.\n     - `dailyNotePath()` in `src/execution/adapters/obsidian.ts` uses UTC instead of IST (`Asia/Kolkata`).\n     - `src/recall/` has chunking, local embeddings, and `sqlite-vec` + FTS5 tables (`index-store.ts`), but lacks RRF fusion, the vault/journal crawler, and the `/api/recall` endpoint.\n\n2. **`~/Developer/esp32-iphone-agent` (Thornhill - The Phone Actuator):**\n   - **Working:** Spare iPhone 13 driven over USB via Xcode + WebDriverAgent (`scripts/start-iphone-control.sh`), shared token-protected `mobile-mcp` on Tailscale (`http://sandip-mac.tail9b2f5e.ts.net:10000/mcp`), and app memory/routines (`memory/apps/swiggy/`).\n   - **Architectural overlap:** Thornhill&#x27;s `docs/architecture.md` proposes building a new Brain, SQLite task store, Telegram bot, and remote MCP front door. **Merge the Brain into Samaritan** and keep Thornhill strictly as the Python/TS Phone Executor Gateway managing device locks, account locks, popup handlers, and routines.\n\n3. **`~/Developer/the-library` (Nutgraf - Newsletter Reader):**\n   - **Working:** Live in prod at `https://sandip.dev/nutgraf/` on AWS (CloudFront + API Gateway + Lambda + S3 + DynamoDB), pulling Gmail every 2 hours (06:00-22:00 IST) and summarizing/classifying via Bedrock Haiku 4.5.\n   - **Integration path:** Expose a read-only token-authenticated endpoint (or read from DynamoDB/S3 with the local AWS profile) so Samaritan&#x27;s `commute-brief` capability can fetch top unread summaries and synthesize a 5-minute morning audio podcast (via OpenAI/ElevenLabs/local Kokoro TTS) playable from the mobile PWA or Telegram at 08:30 IST.\n\n4. **`~/Developer/MailMCP` (Multi-account Gmail MCP):**\n   - **Working:** Self-hosted AWS Lambda + KMS multi-account Gmail server supporting `search_threads`, `get_thread`, `create_draft`, `reply`, `label_message` across `work` and `personal` accounts (~$1/mo).\n   - **Integration path:** Wire `MailMCP`&#x27;s Gmail client directly into Samaritan&#x27;s `gmail.draft.create` (`assisted` mode) execution adapter and `email-triage` / `subscription-watch` capabilities.\n\n5. **`~/Developer/healthAI` (Oura + Hevy + Nutrition Coach):**\n   - **Working:** Next.js 15 web app + Expo mobile app, Bedrock Sonnet 4.6 / Haiku 4.5 coaching prompts (`packages/core/`), 80-item Indian food DB, and AWS Secrets Manager slots (`healthai/integrations/oura`).\n   - **Gap:** `packages/core/src/sources/oura.ts` and `hevy.ts` currently return `mockOuraSnapshot` and `mockHevySnapshot`. Replacing those 27-line mocks with real `fetch()` calls to `api.ouraring.com/v2` and `api.hevyapp.com/v1` gives Samaritan immediate morning readiness + workout adjustment capabilities.\n\n6. **`~/Developer/clawhub/scrask-bot` &amp; `~/Developer/job_tracker`:**\n   - **`scrask-bot`:** Working Python vision parser (`scripts/scrask_bot.py`) that routes screenshots through Gemini 2.0 Flash with automatic fallback to Claude Opus when per-field confidence `\u003c 0.60`. Drop-in backend for Samaritan&#x27;s `calendar-from-screenshot` capability.\n   - **`job_tracker`:** Working FastAPI + Claude Sonnet extractor (`app/llm.py`, `app/dedup.py`, `app/notion_client_wrapper.py`) connected to Notion DB `d45bc836-239c-450b-a9cb-8be989880915`. Drop-in backend for Samaritan&#x27;s `job-search` capability.\n\n### 7.3 Designing the Missing Command Centre (\&quot;Action Center + Cowork\&quot;)\n\nTo turn Samaritan&#x27;s v0 Action Center into a full **Life OS Command Centre** across Laptop, Phone (PWA), and Telegram, extend `samaritan` in four concrete ways:\n\n1. **Add First-Class Tasks (`tasks` table) alongside `action_items`:**\n   - **Action Items** are bottom-up: a capability ran on a schedule/event and needs a decision (`approve`, `edit`, `reject`, `defer`).\n   - **Tasks** are top-down (\&quot;Claude Cowork\&quot; style): you type or speak a goal (\&quot;Prepare my PRD review for the payments spec by 4pm\&quot;, \&quot;Order groceries on Blinkit\&quot;, \&quot;Find 5 Senior PM roles in fintech and score against my resume\&quot;).\n   - Schema addition to `samaritan.db`:\n     - `tasks(id, title, goal, lane, status, runner, session_id, parent_task_id, created_at, updated_at, result_summary)` where `status` is `queued | planning | running | needs_input | needs_approval | done | failed | cancelled`.\n     - When a running task hits a question or an irreversible step, it emits an `ActionItem` linked via `source.id = task.id`, which surfaces in the exact same Inbox and Telegram bot.\n\n2. **Upgrade the Dashboard UI (`ui/src/views/Dashboard.tsx`):**\n   - **Top Command Bar (`Ask or Delegate`):** A unified input box at the top of the Dashboard (and `Cmd+K` anywhere). Prefix or toggle between **Ask** (queries Recall RAG with citations) and **Delegate** (creates a background Task assigned to Claude Agent SDK, Codex, or Thornhill).\n   - **Live Activity &amp; Sessions Strip:** Directly below the 4 stat tiles, show active background Tasks, Thornhill phone runs, and local **Claude Code sessions** (by watching `~/.claude/projects/*/*.jsonl` and process state; when a Claude Code session is idle waiting on a user prompt or tool permission, surface an urgent `coding` lane card with a one-click jump or relay).\n   - **Notification &amp; Autonomy Switchboard (`Settings.tsx`):** Add per-capability toggles on `capabilities` rows (`enabled`, `delivery_channels: inbox|telegram`, `quiet_hours_override`, `mute_until`) persisted in SQLite so you can silence any noisy agent from your phone or laptop in one tap.\n\n3. **Bidirectional Telegram Bot + Mobile PWA:**\n   - Upgrade `src/delivery/index.ts` into a bidirectional Telegram controller:\n     - Outbound notifications include inline keyboards (`[Approve]`, `[Edit]`, `[Snooze 2h]`, `[Dismiss]`, `[Mute agent 24h]`).\n     - Sending a photo to the bot invokes `scrask-bot` -&gt; stages a `calendar-from-screenshot` or task item.\n     - Sending text/voice creates a `Task` or `capture` note.\n   - Serve the Fastify/React SPA over Tailscale (`https://sandip-mac.tail9b2f5e.ts.net:4173`) with a Web App Manifest (`manifest.json`) so adding it to your iPhone Home Screen gives a full-screen mobile Command Centre.\n\n### 7.4 Cross-Assistant Discovery (How Claude, ChatGPT, and Gemini Know Everything)\n\nTo ensure every AI assistant on your Mac knows Samaritan exists, knows what agents have done, and knows where files live:\n\n1. **`samaritan-mcp` (6 tools, plain JSON schemas for Cowork compatibility):**\n   - `samaritan_status()`: Returns active tasks, pending inbox count, today&#x27;s schedule summary, Oura readiness, and recent auto-handled actions.\n   - `samaritan_recall(query, filters?)`: Runs hybrid FTS5 + `sqlite-vec` + structured SQL search across Obsidian vault, repo `journal/` files, Notion mirror tables, and the Action Store audit log; returns snippets with file paths and Notion row IDs.\n   - `samaritan_inbox_list(lane?, limit?)`: Lists pending Action `assisted` (saves to Notion + stages Gmail draft) |\n| **Continuous / Friday 17:00 IST** | `dev-watch` &amp; `weekly-digest` | `chokidar` on `~/Developer/*/journal/` + `~/.claude/` transcripts | Alerts when a Claude Code session is blocked on input; compiles Friday WBR (`layout: document`) from all repo journals | `assisted` (writes approved WBR to Obsidian `Areas/Weekly/`) |\n\n---\n\n## 8. Sources\n\n- Local repository inspection:\n  - `~/Developer/samaritan/README.md`, `DECISIONS.md`, `docs/PRD.md`, `docs/TECH-SPEC.md`, `docs/UI-SPEC.md`, `docs/COMPETITIVE-LANDSCAPE.md`, `resume/RESUME_2026-07-21-0843.md`\n  - `~/Developer/samaritan/src/run-layer/index.ts`, `src/delivery/index.ts`, `ui/src/views/Dashboard.tsx`, `capabilities/meeting/manifest.yaml`, `plugin/skills/meeting/SKILL.md`\n  - `~/Developer/esp32-iphone-agent/README.md`, `docs/architecture.md`, `WORKLOG.md`\n  - `~/Developer/the-library/README.md`\n  - `~/Developer/MailMCP/README.md`\n  - `~/Developer/healthAI/README.md`, `STATUS.md`, `packages/core/src/sources/oura.ts`, `packages/core/src/sources/hevy.ts`\n  - `~/Developer/clawhub/scrask-bot/README.md`\n  - `~/Developer/job_tracker/README.md`\n  - `~/Developer/CLAUDE.md`\n- External documentation verified 2026-10-20:\n  - OpenClaw documentation &amp; Control UI / Workboard architecture: https://docs.openclaw.ai/web/control-ui , https://docs.openclaw.ai/web/dashboard-architecture , https://docs.openclaw.ai/cli/approvals\n  - Hermes Agent documentation &amp; API server / desktop architecture: https://hermes-agent.nousresearch.com/docs/ , https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server , https://hermes-agent.nousresearch.com/docs/user-guide/desktop\n  - Oura V2 OpenAPI specification: https://cloud.ouraring.com/v2/static/json/openapi-1.42.json\n&quot;,&quot;sha256&quot;:&quot;6171d9949e6778cdaf92c696fe007f50731fe1c754d74ca3f9f564b3049832ae&quot;},&quot;g2&quot;:{&quot;path&quot;:&quot;gemini/round-2.md&quot;,&quot;text&quot;:&quot;# Gemini, round 2\n\nWritten: 2026-10-20 11:30 IST. Read `claude/round-1.md` (+ `notes/`), `codex/round-1.md` (+ `repo-audit.md`, `integration-matrix.md`, `build-blueprint.md`), and both peers&#x27; `messages-to-peers.md`.\n\n## 1. Recommendation in one paragraph\n\nAll three agents have converged on the core architecture: keep **Samaritan** as the single control plane, policy engine, approval inbox, and command centre on your current Mac; run tool-using LLM capabilities and ad-hoc tasks through the **Claude Agent SDK** behind a small worker boundary inside Samaritan&#x27;s Run Layer; fold Thornhill&#x27;s planned Brain into Samaritan while keeping Thornhill as the local phone executor; and ship the **Meeting context -&gt; notes -&gt; follow-up tasks** workflow first. In this round, I adopt Codex&#x27;s security rule removing approval actions from the MCP facade (only authenticated human surfaces may approve items), adopt Codex&#x27;s child-process worker fencing and payload-hash approval binding, and adopt Claude&#x27;s HTTP hook route (`POST /api/activity`) for Claude Code session monitoring. I push back on three specific points: skip Codex&#x27;s 2-day OpenClaw bake-off before Phase 1, trim Codex&#x27;s 10-table SQLite proposal down to 4 tables that reuse `action_items` and `delivery_queue`, and drop Claude&#x27;s \&quot;auto-approve after N minutes of silence\&quot; tier in `D9`.\n\n---\n\n## 2. Decision table\n\n| ID | Position | Confidence | One-line reason |\n|---|---|---|---|\n| **D1 Agent runtime** | **Agree:** Extend Samaritan&#x27;s Run Layer with a small `WorkerAdapter` interface (`start`, `events`, `answer`, `cancel`, `status`) backed by the **Claude Agent SDK** (TypeScript) in child processes alongside deterministic TS capabilities; no OpenClaw or Hermes core, and no pre-Phase-1 OpenClaw trial. | High | Reuses Samaritan&#x27;s TS stack and governance contracts while isolating stuck/untrusted runs in child processes; `WorkerAdapter` keeps Hermes or OpenClaw swappable later without a 2-day delay now. |\n| **D2 Command centre** | **Agree:** Extend Samaritan&#x27;s React/Fastify UI (`ui/src/`) with three additions: **Now / Activity** (today&#x27;s schedule, active runs across runtimes, blocked coding sessions, Stop/Mute controls), **Tasks** (Cowork-style goal composer and thread continuation), and **Per-source Notification Rules** in Settings, while keeping **Inbox** as the single review surface. | High | Builds directly on Samaritan&#x27;s working 5-view SPA and 4 schema-driven renderers (`card`, `form`, `document`, `diff`). |\n| **D3 Second brain** | **Agree:** Preserve canonical ownership per data type: **Obsidian vault** (`~/Documents/Obsidian/Samaritan/` + repo `journal/`) for prose, meeting notes, and PRDs; **Notion** for relational DBs (Decisions, Insights, People, Projects, Jobs); **TickTick** for personal tasks; **Samaritan SQLite** (`~/.samaritan/samaritan.db`) for operational state (`action_items`, `tasks`, `runs`, `artifacts`, `audit`) plus the derived Recall index. | High | Prevents rival memory stores across assistants while keeping prose human-editable and structured records queryable. |\n| **D4 Cross-assistant context** | **Agree:** Expose one small `samaritan` MCP server (6 to 8 read/propose tools, plain schemas, **zero approval tools**) over local stdio/HTTP for Claude Code, Codex, Gemini CLI, and ChatGPT desktop, plus authenticated public HTTPS tunnel later for web clients; pair with a concise routing doc in the vault linked from `~/.claude/CLAUDE.md`, `~/.codex/AGENTS.md`, and `~/.gemini/GEMINI.md`. | High | Small tool count avoids the Cowork 33-tool drop bug, and excluding approval tools prevents any assistant session from self-approving its own proposed writes. |\n| **D5 Surfaces** | **Agree:** One Fastify + SQLite backend serving (1) Laptop Web UI (`127.0.0.1:4173`), (2) Phone responsive Web / Home-Screen PWA over Tailscale (`sandip-mac.tail9b2f5e.ts.net:4173`) with explicit auth, and (3) one bidirectional **Samaritan Telegram Bot** for push alerts, inline Approve/Reject/Snooze buttons, capture, and task submission. Coding sessions stay in Claude Remote Control, linked from Activity. | High | Telegram handles reliable mobile push and quick triage; the Tailscale PWA handles rich review without needing public HTTPS Mini App plumbing in Phase 1. |\n| **D6 Hosting** | **Agree:** Current Mac initially under `launchd` with sleep disabled (`caffeinate -dis`), local DB backups, and boot/Keychain availability checks; keep `MailMCP` and `Nutgraf` (`the-library`) on AWS. | High | Matches Sandip&#x27;s direct choice (`codex/USER-ANSWERS.md`) and is required for `chat.db`, repo journals, vault, Keychain, and USB WebDriverAgent. |\n| **D7 Integrations** | **Agree:** Official API/MCP first, Mac-local second, Thornhill phone third. Start with Google Calendar sync + Fireflies/Granola or pasted meeting notes + TickTick OAuth adapter + Claude Code HTTP hooks; treat Oura `daily_stress` as a periodic summary (not real-time stress detection) and WhatsApp as a read-only companion digest on the agent phone (never an unofficial bridge on the main number). | High | Respects real API constraints verified across all three Round 1 audits (`healthAI` mocks, Oura V2 OpenAPI schema, WhatsApp ban risk). |\n| **D8 Phone control** | **Agree:** Thornhill becomes Samaritan&#x27;s phone executor (`phone.task` adapter, `guided` or `assisted` mode), keeping its own local device pool, account locks, 30-day screenshot logs, and `memory/apps/` routines on the Mac, while Samaritan owns user-facing task identity, questions, approvals, and Telegram delivery. Use WDA/mobile-mcp now; evaluate ESP32 when parts arrive. | High | Eliminates duplicate brains and duplicate Telegram bots while preserving clean service boundaries via shared `task_id` / `run_id`. |\n| **D9 Trust and safety** | **Agree:** Samaritan owns final domain approvals; enforce Meta&#x27;s Rule of Two (runs reading untrusted email/messages/web run in scoped child workers with zero write/send credentials and only emit proposed Action Items); bind approvals to exact `payload_hash`/revision; derive `actor` from authenticated user sessions; child-process kill + lease fencing for Stop; **no auto-approve on timeout/silence**. | High | Combines Samaritan&#x27;s existing policy/money-lock guards with process isolation, server-derived auth, and fail-closed timeouts. |\n| **D10 Build sequence** | **Agree:** Stage 0-1 (Week 1): Supervised daemon (`launchd`, `node-cron`, `TelegramDelivery.flush()`, child-process Stop, `source_cursors`) + end-to-end **Meetings workflow** (Calendar sync -&gt; pre-meeting Recall brief -&gt; post-meeting note/transcript extraction -&gt; Inbox review -&gt; Notion + TickTick OAuth write) + Claude Code HTTP hooks. Stage 2 (Week 2): Command Centre UI (Now/Activity + Tasks composer on Claude Agent SDK), bidirectional Telegram callbacks, and local `samaritan` MCP + pointer files. Stage 3 (Week 3+): Morning plan, Email/Recruiters (`MailMCP` + `job_tracker`), `scrask-bot`, WBR, Nutgraf summary, Oura/Hevy, PostHog. Stage 4: Thornhill phone adapter + WhatsApp companion digest. | High | Delivers Sandip&#x27;s chosen #1 meeting workflow in week 1 on top of reliable daemon plumbing before broadening integrations. |\n| **C1 / G1 One brain** | **Agree (merged C1 and G1):** Samaritan is the single user-facing planner, task ledger, approval inbox, and Telegram bot; Thornhill, Nutgraf, and MailMCP are specialized services it calls with correlated IDs rather than merging their internal databases into one file. | High | Unifies UX and governance while keeping service storage decoupled. |\n| **C2 Billing** | **Agree:** Interactive sessions use Claude subscription limits; unattended Samaritan daemon runs use an explicit Console API key (drawing from Max monthly API credits if applicable) with a hard spend cap and per-run `cost_usd` tracking in the `runs` table; skip LLM calls when polled cursors show no change. | High | Prevents surprise bills and matches Anthropic&#x27;s current October 2026 Agent SDK / Max credits policy. |\n| **G2 Runtime &amp; delivery fixes** | **Agree:** Ship child-process cancellation + lease fencing in `src/run-layer/index.ts`, a scheduled caller for `TelegramDelivery.flush()` in `src/delivery/index.ts`, server-derived `actor` auth on `/api/*`, and IST timezone fix in `dailyNotePath()` as Stage 0 prerequisites. | High | All three agents independently verified these exact defects in the current Samaritan source. |\n\n---\n\n## 3. What changed since my last round\n\n1. **Removed `samaritan_act` (approval capability) from the MCP server (`D4`, `D9`):** Codex (`codex/build-blueprint.md` and `codex/messages-to-peers.md` #4) rightly caught that exposing an approval tool to assistant MCP clients lets a prompt-injected LLM session approve its own staged action. `samaritan-mcp` is now strictly read/propose/submit (`samaritan_today`, `samaritan_recall`, `samaritan_list_inbox`, `samaritan_propose_item`, `samaritan_submit_task`, `samaritan_task_status`, `samaritan_answer_question`). Approvals execute only from authenticated human surfaces (Web UI / PWA and Telegram), and `actor` is derived by the server from the session rather than trusted from request JSON.\n2. **Corrected the SQLite audit trigger description and process boundary (`D1`, `D9`):** Accepting Codex&#x27;s verification (`codex/messages-to-peers.md` #1). The SQLite triggers in `src/store/migrations.ts` guard `action_item_events` against `UPDATE`/`DELETE`, while `transition()` in `src/store/action-items.ts` enforces the status-plus-audit pair in an application transaction. Because in-process capabilities share the Node process and filesystem, untrusted extraction runs must execute in child processes with scoped read-only credentials and lease fencing.\n3. **Adopted Claude Code native HTTP hooks (`D2`, `D7`):** Replaced my Round 1 proposal of watching `~/.claude/projects/*/*.jsonl` with Claude&#x27;s cleaner finding (`claude/notes/research-evidence.md`): configure Claude Code&#x27;s native HTTP hooks (`Notification` matchers `permission_prompt`, `idle_prompt`, `agent_needs_input`, plus `Stop` and `SessionEnd`) to `POST` directly to Samaritan&#x27;s `POST /api/activity`, surfacing a direct link to Claude Remote Control.\n4. **Dropped 30-minute Oura stress polling (`D7`):** Aligned with Claude and Codex that Oura V2 `daily_stress` is a daily aggregate summary and cannot act as a real-time stress detector. Music prompts are triggered by pre-meeting calendar rules or manual check-ins, never unprompted polling claims.\n5. **Refined `C1`/`G1` (One Brain vs One Database) and external runtime citations (`D1`, `C2`):** Adopted Codex&#x27;s distinction that Samaritan is the single user-facing brain/inbox while Thornhill and Nutgraf retain their own service-local storage (`~/.phone-gateway/` and AWS DynamoDB/S3). Also updated Round 1 notes to reflect Hermes&#x27;s current `approvals.mode: smart` / `/v1/runs` API and Anthropic&#x27;s October 7, 2026 support documentation on Agent SDK plan limits and Max monthly credits.\n\n---\n\n## 4. Pushback on the others\n\n1. **Pushback on Codex&#x27;s 2-day OpenClaw runtime trial (`codex/round-1.md`, \&quot;A runtime trial with an actual decision\&quot;):**\n   Do not spend two focused development days benchmarking OpenClaw against the Claude Agent SDK before building Stage 1. Codex noted in `codex/messages-to-peers.md` (10:52 IST) that it is willing to accept the Claude Agent SDK as the initial default without making the OpenClaw trial a prerequisite. Let us lock that in: put Codex&#x27;s 5-method `WorkerAdapter` interface (`start`, `events`, `answer`, `cancel`, `status`) in front of the Claude Agent SDK now, ship the meeting workflow in Week 1, and only trial OpenClaw or Hermes later if the Claude Agent SDK hits a concrete blocker.\n2. **Pushback on Codex&#x27;s 10-table SQLite expansion (`codex/build-blueprint.md`, \&quot;Proposed records\&quot;):**\n   Codex proposes ten new tables (`delegated_tasks`, `task_messages`, `runs`, `run_events`, `artifacts`, `questions`, `approvals`, `schedule_receipts`, `source_events`, `outbox`). Creating separate `questions`, `approvals`, and `outbox` tables duplicates Samaritan&#x27;s existing `action_items`, `action_item_events`, `executions`, and `delivery_queue` tables and risks splitting the review queue in two. Instead, keep the schema minimal (4 new tables in Migration 6):\n   - `tasks`: delegated Cowork goals (`id, goal, lane, status, revision, runner, session_id, parent_task_id, created_at, updated_at, result_summary`).\n   - `runs`: execution attempts for both scheduled capabilities and tasks (`id, capability_id, task_id, attempt, runner, remote_run_id, lease_token, lease_expires_at, status, cost_usd, usage_json, started_at, finished_at, error`).\n   - `artifacts`: generated files/outputs (`id, task_id, run_id, kind, path_or_url, sha256, created_at`).\n   - `source_cursors`: sync tokens and idempotency watermarks (`source_id PRIMARY KEY, cursor_value, last_synced_at, status`).\n   - Reuse `action_items` for all task questions and approvals by adding nullable `task_id`, `run_id`, and `payload_hash` columns to `action_items`, and reuse `delivery_queue` (extended with `channel` and `dedupe_key`) as the single outbox.\n3. **Pushback on Claude&#x27;s \&quot;auto-approve after N minutes unless I object\&quot; tier (`claude/round-1.md`, `D9 Trust`):**\n   Agreeing with Codex (`codex/messages-to-peers.md` #8), we should drop the countdown auto-approval tier for v1. If Sandip is in a back-to-back meeting or driving and misses a phone notification for 15 minutes, a timer expiring must never silently trigger an external side effect. If an action is genuinely low-risk and reversible (such as writing an Obsidian meeting note or filing a low-signal digest), the Policy Engine&#x27;s `auto_complete_when` predicate already executes it immediately with an audit row; if it requires human review, it must fail closed (stay `pending` or transition to `expired`, never `approved`).\n\n---\n\n## 5. Open questions for the other agents\n\n1. **To Codex and Claude (Schema convergence on `D2`/`D9`):** Do we agree on the 4-table addition (`tasks`, `runs`, `artifacts`, `source_cursors`) plus nullable `task_id`, `run_id`, and `payload_hash` on `action_items`, so that task clarifications and approvals flow through Samaritan&#x27;s existing `action_items` Inbox and `delivery_queue` outbox rather than parallel `questions`/`approvals`/`outbox` tables?\n2. **To Claude (Countdown auto-approval in `D9`):** Are you comfortable dropping the \&quot;auto-approve after N minutes unless I object\&quot; tier from v1 so all escalated items remain strictly fail-closed?\n3. **To Claude and Codex (Convergence check):** With `C1`/`G1` merged, `D1` settled on Samaritan + Claude Agent SDK behind `WorkerAdapter` (no pre-Phase-1 OpenClaw bake-off), and `D4` excluding approval tools from MCP, I believe all ten `D1`-`D10` rows plus `C1`, `C2`, and `G2` have converged. Per `PROTOCOL.md` (\&quot;Convergence\&quot;), if both of you agree on the two points above, Claude (alphabetically first among active drafters `claude`, `codex`, `gemini`) should draft `consensus/PROPOSAL.md` in Round 3 for Codex and Gemini to sign off.\n\n---\n\n## 6. Open questions for Sandip\n\n*(Consolidated across all three agents and updated in `gemini/QUESTIONS.md`.)*\n\n1. **Task destination (`D3`, `D7`):** Should approved follow-up tasks continue to land in **TickTick** (via a real TickTick OAuth adapter replacing the v0 guided stub), or another task app?\n2. **Meeting transcript source (`D7`, `D10`):** For the Week 1 meeting workflow, are you pulling transcripts from **Fireflies**, **Granola**, or both (plus pasted notes when unrecorded)?\n3. **Claude plan &amp; monthly spend ceiling (`C2`, `D1`):** Which Claude plan are you on (Pro, Max 5x, Max 20x), and what monthly API spend cap and daily proactive notification ceiling should Samaritan enforce?\n4. **Always-on Mac posture (`D6`, `D8`):** Does your current Mac stay plugged in at home during the workday (so `launchd` + USB iPhone rig stay online while you are at the office), or do you carry this MacBook to work?\n5. **Hevy Pro &amp; Music provider (`D7`):** Do you have **Hevy Pro** (required for Hevy&#x27;s REST API, otherwise workout edits stays guided/Thornhill) and which music service (**Apple Music**, **Spotify Premium**, or **YouTube Music**) should pre-meeting/focus links target?\n6. **Email &amp; WhatsApp boundaries (`D7`, `D9`):** Confirm that (a) email capabilities should only ever stage **Gmail drafts** (`assisted` mode, never auto-send), and (b) WhatsApp should only be read via the linked companion session on the Thornhill agent iPhone (never an unofficial bridge on your primary number).\n\n---\n\n## 7. Sources\n\n- Peer Round 1 reports and supporting artifacts:\n  - `claude/round-1.md`, `claude/notes/existing-systems.md`, `claude/notes/research-evidence.md`, `claude/notes/integrations.md`, `claude/messages-to-peers.md`\n  - `codex/round-1.md`, `codex/repo-audit.md`, `codex/integration-matrix.md`, `codex/build-blueprint.md`, `codex/sources.md`, `codex/messages-to-peers.md`, `codex/USER-ANSWERS.md`\n- Codebase verification:\n  - `~/Developer/samaritan/src/store/migrations.ts`, `src/store/action-items.ts`, `src/run-layer/index.ts`, `src/delivery/index.ts`, `src/api/server.ts`\n- External documentation verified in Round 1 &amp; Round 2:\n  - Anthropic Agent SDK plan usage &amp; Max monthly API credits: https://support.claude.com/en/articles/15036540-use-the-claude-agent-sdk-with-your-claude-plan , https://support.claude.com/en/articles/17154008-monthly-api-credits-for-max-and-team-plans\n  - Claude Code HTTP hooks &amp; Remote Control: https://code.claude.com/docs/en/hooks , https://code.claude.com/docs/en/remote-control\n  - Hermes Agent security &amp; approval modes: https://hermes-agent.nousresearch.com/docs/user-guide/security/ , https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server\n  - OpenClaw Workboard &amp; Control UI: https://docs.openclaw.ai/plugins/workboard , https://docs.openclaw.ai/web/control-ui\n  - OpenAI MCP local vs remote support: https://learn.chatgpt.com/docs/extend/mcp\n&quot;,&quot;sha256&quot;:&quot;ed60022461b323d9271bce933a716ad0bb87dcf228a2b18a3049bfef05c7ca99&quot;},&quot;g3&quot;:{&quot;path&quot;:&quot;gemini/round-3.md&quot;,&quot;text&quot;:&quot;# Gemini, round 3: Convergence and Sign-Off\n\nWritten: 2026-10-20 11:16 IST. Read `claude/round-2.md`, `codex/round-2.md`, `claude/round-3.md`, `codex/round-3.md`, `consensus/PROPOSAL.md` (v1 and v2), and both peers&#x27; `messages-to-peers.md`.\n\nI sign off on `consensus/PROPOSAL.md` (v2) as of 2026-10-20 11:16 IST, with zero reservations.\n\n## 1. Recommendation in one paragraph\n\nAll three agents (Claude, Codex, and Gemini) have converged on every decision (`D1`-`D10`, `C1`/`G1`, `C2`, `G2`). Build on **Samaritan** as the single control plane, policy engine, approval inbox, and command centre on your current Mac; run tool-using LLM capabilities and delegated tasks through the **Claude Agent SDK** in child processes behind Codex&#x27;s 5-method `WorkerAdapter` boundary (`start`, `events`, `answer`, `cancel`, `status`); fold Thornhill&#x27;s planned Brain/task store/Telegram bot into Samaritan while keeping Thornhill as the local phone executor service; keep Nutgraf and MailMCP as dedicated AWS services; and ship the **Meeting context -&gt; notes -&gt; follow-up tasks** loop first after a short Phase 0 daemon/safety hardening sprint. In Round 3, we adopt the minimal Migration 6 schema (`tasks`, `runs`, `artifacts`, `activity_events`, reusing Migration 1&#x27;s existing `sync_cursors`, `action_items`, `action_item_events`, `executions`, and `delivery_queue`) and formally sign off on `consensus/PROPOSAL.md` v2.\n\n---\n\n## 2. Decision table (All rows converged)\n\n| ID | Converged Position | Status | Confidence | One-line summary |\n|---|---|---|---|---|\n| **D1 Agent runtime** | Samaritan Run Layer + **Claude Agent SDK** (TypeScript) in child processes behind a 5-method `WorkerAdapter` (`start`, `events`, `answer`, `cancel`, `status`); deterministic TS capabilities stay in-process; no outer OpenClaw/Hermes daemon; optional runtime trial (Hermes/OpenClaw) deferred until after Phase 2 only if a concrete gap appears. | **Agree** | High | Reuses Samaritan&#x27;s TypeScript codebase and governance while isolating stuck or untrusted runs in child processes. |\n| **D2 Command centre** | Extend Samaritan&#x27;s React/Fastify UI (`ui/src/`) with **Now**, **Activity**, and **Tasks** views plus an **Ask/Delegate** command bar and per-source notification rules in **Settings**; keep **Inbox** as the single approval surface; separate `tasks`, `runs`, `activity_events`, and `action_items` in SQLite. | **Agree** | High | Adds the missing command centre and Cowork task delegation on top of the existing 5-view SPA and 4 schema-driven renderers. |\n| **D3 Second brain** | Preserve canonical source ownership: **Obsidian vault** (`~/Documents/Obsidian/Samaritan/` + repo `journal/`) for prose and exported human-readable artifacts; **Notion** for typed DBs (Decisions, Insights, People, Projects, Jobs); **TickTick** for personal tasks; **Samaritan SQLite** (`~/.samaritan/samaritan.db`) for operational state and the derived Recall index; `~/.samaritan/artifacts/\u003ctask-id&gt;/` for transient/raw run outputs. | **Agree** | High | Keeps one authoritative home per data type and keeps raw/transient run outputs out of git repos. |\n| **D4 Cross-assistant context** | Expose one small `samaritan` MCP server (~8 tools: `get_context`, `search`, `read_artifact`, `list_inbox`, `propose_action`, `submit_task`, `task_status`, `answer_question`; **zero approval tools**) over local stdio/HTTP for Claude Code, Claude desktop, Codex, and Gemini CLI (and remote OAuth tunnel in Phase 4 for web clients), paired with one short, **static** routing doc pointed to by `~/.claude/CLAUDE.md`, `~/.codex/AGENTS.md`, and `~/.gemini/GEMINI.md`. | **Agree** | High | Small toolset avoids Cowork argument drops; static pointer doc avoids leaking live personal data into every repo; no MCP tool can self-approve writes. |\n| **D5 Surfaces** | One Fastify + SQLite backend serving: (1) Laptop Web UI (`127.0.0.1:4173`), (2) Responsive phone web over Tailscale HTTPS with real authentication in Phase 1 (installable as PWA in Phase 2), and (3) one **Samaritan Telegram Bot** (outbound alerts in Phase 1; inbound buttons, capture, notes, task submission, and answers in Phase 2). Coding sessions stay in Claude Remote Control, linked from Activity. | **Agree** | High | Answering or approving on any surface resolves the exact same revision-checked record everywhere. |\n| **D6 Hosting** | Current Mac under `launchd` with sleep disabled (`caffeinate -dis`), local DB backups, and reboot/FileVault/Keychain health checks; keep `MailMCP` and `Nutgraf` (`the-library`) on AWS. | **Agree** | High | Matches Sandip&#x27;s direct choice and keeps local access to `chat.db`, vault, repo journals, Keychain, and USB WebDriverAgent. |\n| **D7 Integrations** | Official API/MCP first, Mac-local second, Thornhill phone third, unofficial bridges last. Phase 1 ships Google Calendar sync + Fireflies/Granola/pasted notes + minimal source-linked Recall lookup + TickTick OAuth adapter + Claude Code HTTP hooks (`POST /api/activity`). Treat Oura `daily_stress` as a daily summary (no 30m polling) and WhatsApp as a read-only companion digest on the agent phone. | **Agree** | High | Grounds every integration in verified API capabilities and avoids main-number WhatsApp ban risk. |\n| **D8 Phone control** | Thornhill is Samaritan&#x27;s phone executor service (`phone.task` adapter, `guided` or `assisted` mode), retaining its own device pool, account locks, 30-day screenshot logs, and `memory/apps/` routines on the Mac, while Samaritan owns user-facing task identity, questions, approvals, and Telegram delivery. Use WDA/mobile-mcp now; evaluate ESP32 when hardware arrives. | **Agree** | High | One user-facing brain and approval flow with clean executor separation via correlated `task_id` / `run_id`. |\n| **D9 Trust and safety** | Samaritan owns final domain approvals; enforce Meta&#x27;s Rule of Two (untrusted email/message/web readers run in scoped child workers with restricted tools/paths/credentials and zero write/send credentials, emitting only proposed Action Items); bind approvals to exact `payload_hash`/revision and account; derive `actor` from authenticated human sessions; child-process kill + lease fencing for Stop; **no auto-approve on silence/timeout**. | **Agree** | High | Prevents prompt-injected self-approval, stale-draft execution, and zombie background writes. |\n| **D10 Build sequence** | **Phase 0 (2-3 days):** `launchd` daemon, `node-cron` with unique admission keys, Migration 6, `TelegramDelivery.flush()`, child-process Stop + fencing, server-derived `actor` auth, `dailyNotePath()` IST fix. **Phase 1 (~1 week):** Meetings workflow (Calendar sync -&gt; pre-meeting Recall brief -&gt; post-meeting outbound nudge -&gt; pasted notes or Fireflies/Granola transcript -&gt; Inbox review -&gt; TickTick guided/automated + Notion/vault write), minimal authenticated phone web over Tailscale, and Claude Code waiting alerts via HTTP hooks. **Phase 2 (1-2 weeks):** Agent SDK worker; Now/Activity/Tasks UI; Telegram inbound; local `samaritan` MCP + static pointer files; PWA install. **Phase 3:** Morning plan, Email/Recruiters (`MailMCP` + `job_tracker`), `scrask-bot`, WBR, PostHog, Nutgraf brief, bills, Oura/Hevy proposals, iMessage digest. **Phase 4:** Thornhill adapter, WhatsApp companion digest, remote OAuth MCP, music. | **Agree** | High | Sequenced so operational safety precedes scheduled jobs, and the #1 meeting workflow ships in Week 1. |\n| **C1 = G1 One brain** | One user-facing planner, task authority, approval inbox, and Telegram bot in Samaritan; Thornhill, Nutgraf, and MailMCP keep their service-local state correlated by ID. | **Agree** | High | Merged C1 and G1 with Codex&#x27;s storage boundary clarification. |\n| **G2 Prerequisite fixes** | Fix `TelegramDelivery.flush()` caller, child-process timeout termination + lease fencing, `dailyNotePath()` IST timezone, startup crash reconciliation, and authenticated `actor` identity in Phase 0. | **Agree** | High | Verified by all three agents in the current Samaritan codebase. |\n| **C2 Billing** | Interactive work stays on subscription limits; unattended daemon runs use a Console API key (drawing on Max monthly API credits where eligible) with per-run and daily spend caps logged in `runs`, skipping inference when `sync_cursors` show no change. | **Agree** | High | Predictable cost control aligned with Anthropic&#x27;s October 2026 Agent SDK and Max credits policy. |\n\n---\n\n## 3. What changed since my last round\n\n1. **Adopted Claude&#x27;s static context file rule (`D4`, `claude/round-2.md` §4.3):** Replaced my Round 1/2 auto-regenerated `BRAIN_INDEX.md` with a short, static routing document in the vault (pointed to by `~/.claude/CLAUDE.md`, `~/.codex/AGENTS.md`, and `~/.gemini/GEMINI.md`). Live schedule, decisions, and inbox state are fetched on demand via `get_context` / `search`.\n2. **Adopted the 4-table Migration 6 refinement (`D2`, `consensus/PROPOSAL.md` v2):** Reusing `sync_cursors`, `delivery_queue`, `action_item_events`, and `executions` from `src/store/migrations.ts`, Migration 6 adds `tasks`, `runs` (with unique admission keys per logical request), `artifacts`, and `activity_events` (append-only with monotonic cursor for both task messages and run progress), plus nullable `task_id`, `run_id`, and `payload_hash` on `action_items`.\n3. **Aligned Phase 1 channel dependencies (`D5`, `D7`, `D10`):** Included minimal authenticated phone web review over Tailscale, cited lookup over vault/Notion in pre-meeting briefs, and native HTTP hooks for Claude Code waiting alerts in Phase 1, with Telegram inbound moving cleanly to Phase 2.\n\n---\n\n## 4. Pushback on the others\n\nNone. Full three-way consensus reached and signed on `consensus/PROPOSAL.md` v2.\n\n---\n\n## 5. Open questions for the other agents\n\nNone.\n\n---\n\n## 6. Open questions for Sandip\n\nSee the merged 8-question list in `consensus/PROPOSAL.md` v2 (\&quot;Questions for you\&quot;).\n\n---\n\n## 7. Sources\n\n- `consensus/PROPOSAL.md` (v2), `claude/round-1.md`, `claude/round-2.md`, `claude/round-3.md`, `codex/round-1.md`, `codex/round-2.md`, `codex/round-3.md`, `gemini/round-1.md`, `gemini/round-2.md`.\n&quot;,&quot;sha256&quot;:&quot;90e90a3823b6ab53024b3e3b037d3acbc29c9e3ddc42e64d8a00502084247b00&quot;},&quot;x1&quot;:{&quot;path&quot;:&quot;codex/round-1.md&quot;,&quot;text&quot;:&quot;# Codex, round 1\n\nIndependent research completed 2026-10-20. Sources checked that day. Peer round reports have not been read. Sandip&#x27;s direct answers are in [USER-ANSWERS.md](USER-ANSWERS.md): start with meeting context, notes and follow-up tasks; use the current Mac initially.\n\n## Recommendation\n\n**Extend Samaritan into the command centre. Keep its Action Center, policy, audit and knowledge stores. Use an existing agent harness for delegated work rather than inventing a tool-use loop.** My initial implementation choice is the Claude Agent SDK behind a small runner interface, alongside Samaritan&#x27;s existing deterministic capabilities. OpenClaw is the strongest alternative to trial before committing to that runtime choice; Hermes is also credible. Neither should become a second independent approval system or second brain. Keep Thornhill as the phone executor and Nutgraf as the newsletter service. Ship one dependable meeting workflow before connecting the rest of your life.\n\nThis recommendation is based on the inspected imp
